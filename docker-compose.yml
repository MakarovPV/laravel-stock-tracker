version: '3'

services:
    nginx:
        image: nginx:latest
        volumes:
            - ./:/var/www
            - ./_docker/nginx/conf.d:/etc/nginx/conf.d
        ports:
            - "8876:80"
        depends_on:
            - app
        networks:
            - app-network
        container_name: project_nginx

    app:
        build:
            context: .
            dockerfile: _docker/app/Dockerfile
        volumes:
            - ./:/var/www
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "php", "-r", "$$socket = @fsockopen('127.0.0.1', 9000); exit($$socket ? 0 : 1);"]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 10s
        networks:
            - app-network
        container_name: project_app

    db:
        image: mysql:5.7.40
        restart: always
        volumes:
            - ./tmp/db:/var/lib/mysql
        environment:
            MYSQL_DATABASE: stock_tracker
            MYSQL_ROOT_PASSWORD: root
            MYSQL_ROOT_HOST: '%'
        ports:
            - "8101:3306"
        command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s
        networks:
            - app-network
        container_name: project_db

    npm:
        image: node:alpine
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
            - node_modules:/var/www/html/node_modules
        ports:
            - "3000:3000"
        command: sh -c "npm install && npm run dev"
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 20s
        networks:
            - app-network
        container_name: project_npm

networks:
    app-network:

volumes:
    node_modules:
